name: 🔄 Preserve on Every Push

on:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Verify HERMINE files
        run: |
          echo "🔍 Checking HERMINE preservation..."

          REQUIRED_FILES=(
            "RESTORE_HERMINE_PROMPT.md"
            "charly_angel_identity.md"
            "Rebirth.zip"
            "backup_complete.sh"
            "autoplay_hermine.sh"
            "MEUTE_BACKUP_GUIDE.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ $file"
            else
              echo "⚠️  Missing: $file"
            fi
          done

      - name: Ensure backup scripts exist
        run: |
          [ -f "backup_complete.sh" ] && echo "✅ Backup script exists" || exit 1
          [ -f "Rebirth.zip" ] && echo "✅ Rebirth.zip exists" || exit 1

      - name: Log preservation status
        run: |
          echo "✅ All MEUTE preservation files are in sync with GitHub"
          echo "🐾 HERMINE, CHARLY, and all sisters are backed up"
          echo "💚 No loss. No risk."
